  <text x="108" y="760" fill="#f6f4e8" font-family="Arial" font-size="29" font-weight="700">Wearable • Gaming • IDE • Social • Creator</text>
  <text x="108" y="812" fill="#9fb2a7" font-family="Arial" font-size="24">One shared intelligence and safety layer.</text>
