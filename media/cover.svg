    <g transform="translate(875)"><rect width="205" height="82" rx="20" fill="#142f24" stroke="#365747"/><text x="102" y="34" text-anchor="middle" fill="#d9f871" font-size="18" font-weight="700">DELIVERY</text><text x="102" y="60" text-anchor="middle" fill="#9fb2a7" font-size="14">Timing + privacy</text></g>
