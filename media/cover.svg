    <text y="200" fill="#f6f4e8" font-family="Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-4">Every Digital</text>
    <text y="296" fill="#f6f4e8" font-family="Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-4">Moment.</text>
    <text y="360" fill="#a9b8ae" font-family="Arial, sans-serif" font-size="31">Context-aware Scripture, delivered safely inside the moment.</text>
  </g>
  <g transform="translate(1180 205)">
