    <rect x="30" y="48" width="240" height="405" rx="44" fill="#0e2119"/>
    <text x="150" y="106" text-anchor="middle" fill="#9caf9f" font-family="Arial" font-size="17" letter-spacing="3">RUN / RECOVERY</text>
    <text x="150" y="220" text-anchor="middle" fill="#f6f4e8" font-family="Arial" font-size="86" font-weight="800">170</text>
    <text x="150" y="254" text-anchor="middle" fill="#9caf9f" font-family="Arial" font-size="15" letter-spacing="3">HEART RATE</text>
    <rect x="48" y="286" width="204" height="130" rx="24" fill="url(#card)" filter="url(#glow)"/>
    <text x="68" y="320" fill="#102017" font-family="Georgia" font-size="17">Those who hope</text>
    <text x="68" y="346" fill="#102017" font-family="Georgia" font-size="17">in the Lord will renew</text>
    <text x="68" y="372" fill="#102017" font-family="Georgia" font-size="17">their strength.</text>
    <text x="68" y="400" fill="#425044" font-family="Arial" font-size="11">Demo excerpt · Isaiah 40:31</text>
  </g>
