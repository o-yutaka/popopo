    <path d="M200 41 H260" stroke="#d9f871" stroke-width="4"/><path d="M250 31 L264 41 L250 51" fill="none" stroke="#d9f871" stroke-width="4"/>
    <g transform="translate(275)"><rect width="205" height="82" rx="20" fill="#142f24" stroke="#365747"/><text x="102" y="34" text-anchor="middle" fill="#d9f871" font-size="18" font-weight="700">GLOO AI</text><text x="102" y="60" text-anchor="middle" fill="#9fb2a7" font-size="14">Need + tone + safety</text></g>
    <path d="M490 41 H550" stroke="#d9f871" stroke-width="4"/><path d="M540 31 L554 41 L540 51" fill="none" stroke="#d9f871" stroke-width="4"/>
