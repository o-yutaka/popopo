<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Scripture Everywhere AI</title>
  <desc id="desc">A wearable moment connected to Gloo AI Studio and YouVersion through a safe contextual delivery pipeline.</desc>
  <defs>
    <radialGradient id="bg" cx="82%" cy="7%" r="96%"><stop offset="0" stop-color="#245b44"/><stop offset="0.5" stop-color="#0d241b"/><stop offset="1" stop-color="#06100d"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3ffd2"/><stop offset="1" stop-color="#d9f871"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1325" cy="105" r="250" fill="#d9f871" opacity=".08"/>
  <path d="M0 715 C350 535 680 825 1000 660 S1450 580 1600 665 V900 H0Z" fill="#102b20"/>
