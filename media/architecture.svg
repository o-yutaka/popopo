<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Scripture Everywhere AI architecture</title><desc id="d">Five digital connectors feeding one shared context, Gloo AI, YouVersion, safety, and native delivery pipeline.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07120f"/><stop offset="1" stop-color="#153b2c"/></linearGradient><style>.h{font:800 62px Arial;fill:#f6f4e8}.k{font:700 20px Arial;fill:#d9f871;letter-spacing:4px}.n{font:700 24px Arial;fill:#f6f4e8}.s{font:18px Arial;fill:#a9b8ae}.box{fill:#10251d;stroke:#3f6755;stroke-width:3}.core{fill:#d9f871;stroke:#f3ffd1;stroke-width:3}.dark{fill:#102017}.line{stroke:#d9f871;stroke-width:5;fill:none}.dash{stroke:#6f8f80;stroke-width:3;stroke-dasharray:10 10}</style></defs><rect width="1600" height="900" fill="url(#g)"/><text x="95" y="90" class="k">TECHNICAL ARCHITECTURE</text><text x="95" y="165" class="h">Five frontiers. One trusted brain.</text><g transform="translate(85 255)"><g><rect class="box" width="220" height="94" rx="22"/><text class="n" x="110" y="39" text-anchor="middle">Wearable</text><text class="s" x="110" y="68" text-anchor="middle">Biometrics + effort</text></g><g transform="translate(0 112)"><rect class="box" width="220" height="94" rx="22"/><text class="n" x="110" y="39" text-anchor="middle">Gaming</text><text class="s" x="110" y="68" text-anchor="middle">Failure + session</text></g><g transform="translate(0 224)"><rect class="box" width="220" height="94" rx="22"/><text class="n" x="110" y="39" text-anchor="middle">IDE</text><text class="s" x="110" y="68" text-anchor="middle">Build + focus</text></g><g transform="translate(0 336)"><rect class="box" width="220" height="94" rx="22"/><text class="n" x="110" y="39" text-anchor="middle">Social</text><text class="s" x="110" y="68" text-anchor="middle">Distress + privacy</text></g><g transform="translate(0 448)"><rect class="box" width="220" height="94" rx="22"/><text class="n" x="110" y="39" text-anchor="middle">Creator</text><text class="s" x="110" y="68" text-anchor="middle">Pressure + toxicity</text></g></g><path class="dash" d="M305 302 H390 V750 H305 M390 525 H470"/><g transform="translate(470 452)"><rect class="box" width="230" height="150" rx="28"/><text class="n" x="115" y="54" text-anchor="middle">Context</text><text class="n" x="115" y="85" text-anchor="middle">Normalizer</text><text class="s" x="115" y="119" text-anchor="middle">One typed contract</text></g><path class="line" d="M700 527 H775"/><path class="line" d="M758 512 L780 527 L758 542"/><g transform="translate(790 420)"><rect class="core" width="285" height="215" rx="34"/><text class="dark" x="142" y="58" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800">GLOO AI STUDIO</text><text class="dark" x="142" y="103" text-anchor="middle" font-family="Arial" font-size="21">Human need</text><text class="dark" x="142" y="135" text-anchor="middle" font-family="Arial" font-size="21">Theme + tone</text><text class="dark" x="142" y="167" text-anchor="middle" font-family="Arial" font-size="21">Safety eligibility</text></g><path class="line" d="M1075 527 H1150"/><path class="line" d="M1133 512 L1155 527 L1133 542"/><g transform="translate(1165 452)"><rect class="box" width="300" height="150" rx="28"/><text class="n" x="150" y="54" text-anchor="middle">YouVersion Platform</text><text class="s" x="150" y="91" text-anchor="middle">Canonical passage ID</text><text class="s" x="150" y="119" text-anchor="middle">Licensed Scripture text</text></g><g transform="translate(790 700)"><rect class="box" width="675" height="105" rx="26"/><text class="n" x="337" y="42" text-anchor="middle">Delivery Policy</text><text class="s" x="337" y="72" text-anchor="middle">Consent • crisis suppression • privacy • timing • cooldown • native surface</text></g><path class="dash" d="M933 635 V700 M1315 602 V700"/><text x="95" y="855" class="s">No diagnosis • No divine certainty claims • Sensitive social moments default to private human review</text></svg>