name: Capture verified live API evidence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      GLOO_CLIENT_ID: ${{ secrets.GLOO_CLIENT_ID }}
      GLOO_CLIENT_SECRET: ${{ secrets.GLOO_CLIENT_SECRET }}
      GLOO_TOKEN_URL: https://platform.ai.gloo.com/oauth2/token
      GLOO_BASE_URL: https://platform.ai.gloo.com/ai/v2
      GLOO_MODEL: ${{ vars.GLOO_MODEL || 'gloo-openai-gpt-5-mini' }}
      GLOO_CHAT_PATH: /chat/completions
      YVP_APP_KEY: ${{ secrets.YVP_APP_KEY }}
      YOUVERSION_BASE_URL: https://api.youversion.com/v1
      YOUVERSION_BIBLE_ID: ${{ vars.YOUVERSION_BIBLE_ID || '3034' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require sponsor credentials
        shell: bash
        run: |
          test -n "$GLOO_CLIENT_ID" || { echo "Missing GLOO_CLIENT_ID secret"; exit 1; }
          test -n "$GLOO_CLIENT_SECRET" || { echo "Missing GLOO_CLIENT_SECRET secret"; exit 1; }
          test -n "$YVP_APP_KEY" || { echo "Missing YVP_APP_KEY secret"; exit 1; }
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Start API
        working-directory: backend
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/scripture-api.log 2>&1 &
          echo $! > /tmp/scripture-api.pid
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1" || { cat /tmp/scripture-api.log; exit 1; }
      - name: Capture redacted proof
        run: python backend/scripts/capture_live_evidence.py
      - name: Publish verified status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence_path = Path("evidence/live-api-evidence.json")
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          calls = evidence.get("response", {}).get(
              "sponsor_calls_executed",
              evidence.get("sponsor_calls_executed", []),
          )
          if calls != ["gloo", "youversion"]:
              raise SystemExit(f"Refusing verified status for calls={calls!r}")
          status = {
              "verified": True,
              "sponsor_calls_executed": calls,
              "evidence_path": "evidence/live-api-evidence.json",
              "message": "Redacted evidence confirms both sponsor APIs executed in one request.",
          }
          Path("evidence/live-api-status.json").write_text(
              json.dumps(status, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit proof
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/live-api-evidence.json evidence/live-api-status.json
          git commit -m "Add verified live Gloo and YouVersion evidence [skip ci]" || exit 0
          git push
      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-api-evidence
          path: |
            evidence/live-api-evidence.json
            evidence/live-api-status.json
