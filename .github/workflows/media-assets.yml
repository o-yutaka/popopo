name: Render media gallery PNGs

on:
  push:
    branches: [main]
    paths:
      - "media/*.svg"
      - ".github/workflows/media-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render Kaggle and YouTube assets
        run: |
          rsvg-convert -w 1600 -h 900 media/cover.svg -o media/cover.png
          rsvg-convert -w 1600 -h 900 media/architecture.svg -o media/architecture.png
          file media/cover.png media/architecture.png
      - name: Commit generated PNG files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add media/cover.png media/architecture.png
          git commit -m "Add rendered Media Gallery PNG assets [skip ci]" || exit 0
          git push
