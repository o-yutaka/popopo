name: Render three-minute submission video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer
        run: |
          pip install playwright edge-tts
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Start static demo
        run: |
          python -m http.server 8000 > /tmp/static-demo.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/video.html && break; sleep 1; done
      - name: Record exact visual story
        run: python tools/render_video.py
      - name: Generate narration
        run: python tools/build_narration.py
      - name: Mix exact 180-second MP4
        shell: bash
        run: |
          AUDIO_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 build/narration.mp3)
          TEMPO=$(python -c "d=float('$AUDIO_DURATION'); print(max(0.5,min(2.0,d/180.0)))")
          ffmpeg -y -ss 0.75 \
            -i build/scripture-everywhere.webm \
            -i build/narration.mp3 \
            -filter_complex "[1:a]atempo=${TEMPO},apad=pad_dur=180,atrim=duration=180[a]" \
            -map 0:v:0 -map "[a]" -t 180 \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart \
            build/scripture-everywhere-3min.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 build/scripture-everywhere-3min.mp4)
          python -c "d=float('$DURATION'); assert 179.5 <= d <= 180.1, f'Unexpected final duration: {d}'"
      - name: Upload submission package
        uses: actions/upload-artifact@v4
        with:
          name: scripture-everywhere-youtube-package
          retention-days: 14
          path: |
            build/scripture-everywhere-3min.mp4
            video/captions.srt
            video/youtube-description.md
            media/cover.svg
            media/architecture.svg
